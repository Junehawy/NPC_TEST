  <!-- 腿 -->
  <rect x="24" y="52" width="6" height="8" rx="2.5" fill="#4a6b3a"/>
  <rect x="34" y="52" width="6" height="8" rx="2.5" fill="#4a6b3a"/>
  <rect x="22.5" y="58.5" width="9" height="3.5" rx="1.5" fill="#33482a"/>
  <rect x="32.5" y="58.5" width="9" height="3.5" rx="1.5" fill="#33482a"/>
  <!-- 躯干 -->
  <path d="M 21 44 L 43 44 L 41 54 L 23 54 Z" fill="#3f9d5f" stroke="#1e5c33" stroke-width="2.5"/>
