  <path d="M 43 45 Q 49 48 48 53" stroke="#3f9d5f" stroke-width="6" fill="none" stroke-linecap="round"/>
  <circle cx="16" cy="54" r="2.8" fill="#e8c39e"/>
  <circle cx="48" cy="54" r="2.8" fill="#e8c39e"/>
  <!-- 头 -->
  <circle cx="32" cy="27" r="14" fill="#e8c39e" stroke="#c99b72" stroke-width="2"/>
  <!-- 草帽 -->
  <ellipse cx="32" cy="22" rx="17" ry="5.5" fill="#c9a35c" stroke="#8a6b30" stroke-width="2.5"/>
  <path d="M 18 22 Q 18 10 32 10 Q 46 10 46 22 L 44 22 Q 44 13 32 13 Q 20 13 20 22 Z" fill="#d8b878" stroke="#8a6b30" stroke-width="2"/>
  <!-- 眼睛 -->
  <circle cx="26.5" cy="29" r="2.6" fill="#1e3a22"/>
  <circle cx="37.5" cy="29" r="2.6" fill="#1e3a22"/>
  <circle cx="27.3" cy="28.2" r="0.9" fill="#ffffff"/>
  <circle cx="38.3" cy="28.2" r="0.9" fill="#ffffff"/>
