  <path d="M 28 36 Q 32 38.5 36 36" stroke="#8a6b30" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- 腮红 -->
  <circle cx="22.5" cy="34" r="2.5" fill="#e89a9a88"/>
  <circle cx="41.5" cy="34" r="2.5" fill="#e89a9a88"/>
